[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

# Unified document admin (must come BEFORE the wildcard)
[[redirects]]
  from = "/docs/admin"
  to = "/docs/admin.html"
  status = 200
  force = true

# Old intake admin URL → permanent redirect to unified admin
[[redirects]]
  from = "/intake/admin"
  to = "/docs/admin"
  status = 301
  force = true

# Serve all client documents via the type-aware function
[[redirects]]
  from = "/intake/:slug"
  to = "/.netlify/functions/doc-serve"
  status = 200

[[redirects]]
  from = "/engagement/:slug"
  to = "/.netlify/functions/doc-serve"
  status = 200

[[redirects]]
  from = "/sow/:slug"
  to = "/.netlify/functions/doc-serve"
  status = 200

[[redirects]]
  from = "/operating/:slug"
  to = "/.netlify/functions/doc-serve"
  status = 200

[[redirects]]
  from = "/upload/:slug"
  to = "/.netlify/functions/doc-serve"
  status = 200

# Short marketing URLs → canonical landing pages (301)
# force = true so these win over any generated static HTML at the same path.
[[redirects]]
  from = "/prenup"
  to = "/prenuptial-agreement-attorney"
  status = 301
  force = true

[[redirects]]
  from = "/prenup/*"
  to = "/prenuptial-agreement-attorney"
  status = 301
  force = true

[[redirects]]
  from = "/tax-strategy"
  to = "/tax-attorney-small-business"
  status = 301
  force = true

[[redirects]]
  from = "/tax-strategy/*"
  to = "/tax-attorney-small-business"
  status = 301
  force = true

[[redirects]]
  from = "/startup"
  to = "/startup-attorney-california"
  status = 301
  force = true

[[redirects]]
  from = "/startup/*"
  to = "/startup-attorney-california"
  status = 301
  force = true

[[redirects]]
  from = "/creator"
  to = "/creator-attorney"
  status = 301
  force = true

[[redirects]]
  from = "/creator/*"
  to = "/creator-attorney"
  status = 301
  force = true

[[redirects]]
  from = "/contract-drafting"
  to = "/business-contract-attorney"
  status = 301
  force = true

[[redirects]]
  from = "/contract-drafting/*"
  to = "/business-contract-attorney"
  status = 301
  force = true

[[redirects]]
  from = "/entity-structuring"
  to = "/business-structure-attorney"
  status = 301
  force = true

[[redirects]]
  from = "/entity-structuring/*"
  to = "/business-structure-attorney"
  status = 301
  force = true

# Next.js static export: each page has its own HTML file.
# The catch-all below handles direct URL access for pages that
# don't exist as separate files (404 fallback). Netlify form
# POST submissions are processed at the edge before these rules run.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Method = ["GET", "HEAD"]}
